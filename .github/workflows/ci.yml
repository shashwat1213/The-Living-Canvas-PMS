name: CI

# Runs the exact same verification commands documented in README.md and
# required by AGENTS.md before any task is considered done — no parallel
# check invented outside what's already the human-run gate.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, build, test
    runs-on: ubuntu-latest

    # Matches docker-compose.yml's credentials so DATABASE_URL below is
    # the same shape a contributor's local .env already uses — this is a
    # real Postgres (unlike the WASM verification instance used in the
    # sandbox that authored Phase 1, see DECISIONS.md), so migrations are
    # applied and tested against the actual target engine here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: living_canvas
          POSTGRES_PASSWORD: living_canvas
          POSTGRES_DB: living_canvas_pms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U living_canvas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://living_canvas:living_canvas@localhost:5432/living_canvas_pms?schema=public
      # CI-only dummy secret — never a real one, per DevOps's "no secrets
      # in the repo, ever" convention. Rotated production secrets are
      # environment-level config outside this repo.
      JWT_SECRET: ci-only-dummy-secret-not-used-anywhere-else
      FRONTEND_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate -w backend

      - name: Apply database migrations (migration dry-run)
        run: npm run db:migrate:deploy -w backend

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
